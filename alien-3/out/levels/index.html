<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Alien 3 — уровень 1</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#111;color:#ddd;font:14px system-ui,sans-serif}
header{position:sticky;top:0;background:#1b1b1b;padding:8px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:2;border-bottom:1px solid #333}
button{background:#2a2a2a;color:#ddd;border:1px solid #444;border-radius:4px;padding:4px 10px;cursor:pointer}button.on{background:#3d5a80;border-color:#5b7fb0}
#wrap{overflow:auto;height:calc(100vh - 50px)}#stage{position:relative;transform-origin:0 0}
#stage img{display:block;image-rendering:pixelated;position:absolute;left:0;top:0}
#pos{font-variant-numeric:tabular-nums;color:#aaa}
details{padding:0 12px}table{border-collapse:collapse;margin:8px 0}td{padding:2px 10px;border-bottom:1px solid #2a2a2a}td:last-child{text-align:right;font-variant-numeric:tabular-nums}
</style></head><body>
<header>
<select id="lvl"><option value="1">Уровень 1 ($A8=0) ✓ проверен</option><option value="2">Уровень 2 ($A8=1) — не проверен</option><option value="3">Уровень 3 ($A8=2) — не проверен</option><option value="4">Уровень 4 ($A8=3) — не проверен</option><option value="5">Уровень 5 ($A8=4) — не проверен</option><option value="6">Уровень 6 ($A8=5) — не проверен</option><option value="7">Уровень 7 ($A8=6) — не проверен</option><option value="8">Уровень 8 ($A8=7) — не проверен</option><option value="9">Уровень 9 ($A8=8) — не проверен</option><option value="10">Уровень 10 ($A8=9) — не проверен</option><option value="11">Уровень 11 ($A8=10) — не проверен</option><option value="12">Уровень 12 ($A8=11) — не проверен</option></select>
<button id="bLevel" class="on">Карта</button><button id="bCheck">Проверка</button><button id="bBlend">Наложение</button>
<span>Масштаб:</span><button data-z="0.5">½</button><button data-z="1" class="on">1×</button><button data-z="2">2×</button><button data-z="3">3×</button>
<span id="pos"></span>
<span style="color:#888">проверка: тёмное — не видено, оранжевое — устаревшая клетка игры, красное — расхождение</span>
</header>
<details><summary>Цифры проверки</summary><table id="nums"></table></details>
<div id="wrap"><div id="stage"><img id="iLevel" src="01.png"><img id="iCheck" src="01-check.png" style="display:none"></div></div>
<script>
const CHECKS={"1": {"frames": 100367, "framesSkipped": 2833, "samples": 64592713, "matched": 64209795, "matchPercent": 99.407, "staleSamples": 382918, "matchPercentStaleApart": 100, "writesChecked": 275724, "writesMatched": 275724, "writesMatchPercent": 100, "writesUntagged": 7504, "attributeWritesChecked": 87108, "attributeWritesMatched": 87108, "tileDiffs": 0, "paletteDiffs": 0, "outsideLayout": 469337, "notBuiltTiles": 1180170, "notBuiltAttributes": 0, "cellsSeen": 34379, "cellsOfLevel": 61440, "cellsNotVoid": 32096, "cellsNotVoidSeen": 25595, "cellsEverDiffered": 0, "cellsOnlyStale": 1745, "scrollMismatch": 0, "chrMismatchLines": 0, "bgTableLines": 0, "headerPalette": "0f0208180f1b06160f0c1c2c0f0c1c2c", "framesWithOtherPalette": 0, "otherPalettes": {}, "parts": {"start": {"frames": 6000, "samples": 3957150, "matched": 3957150, "staleSamples": 0, "matchPercent": 100, "matchPercentStaleApart": 100, "writesChecked": 18136, "writesMatched": 18136, "attributeWritesChecked": 9715, "attributeWritesMatched": 9715}, "teleports": {"frames": 94367, "samples": 60635563, "matched": 60252645, "staleSamples": 382918, "matchPercent": 99.368, "matchPercentStaleApart": 100, "writesChecked": 257588, "writesMatched": 257588, "attributeWritesChecked": 77393, "attributeWritesMatched": 77393}}}};
let S={"frames": 100367, "framesSkipped": 2833, "samples": 64592713, "matched": 64209795, "matchPercent": 99.407, "staleSamples": 382918, "matchPercentStaleApart": 100, "writesChecked": 275724, "writesMatched": 275724, "writesMatchPercent": 100, "writesUntagged": 7504, "attributeWritesChecked": 87108, "attributeWritesMatched": 87108, "tileDiffs": 0, "paletteDiffs": 0, "outsideLayout": 469337, "notBuiltTiles": 1180170, "notBuiltAttributes": 0, "cellsSeen": 34379, "cellsOfLevel": 61440, "cellsNotVoid": 32096, "cellsNotVoidSeen": 25595, "cellsEverDiffered": 0, "cellsOnlyStale": 1745, "scrollMismatch": 0, "chrMismatchLines": 0, "bgTableLines": 0, "headerPalette": "0f0208180f1b06160f0c1c2c0f0c1c2c", "framesWithOtherPalette": 0, "otherPalettes": {}, "parts": {"start": {"frames": 6000, "samples": 3957150, "matched": 3957150, "staleSamples": 0, "matchPercent": 100, "matchPercentStaleApart": 100, "writesChecked": 18136, "writesMatched": 18136, "attributeWritesChecked": 9715, "attributeWritesMatched": 9715}, "teleports": {"frames": 94367, "samples": 60635563, "matched": 60252645, "staleSamples": 382918, "matchPercent": 99.368, "matchPercentStaleApart": 100, "writesChecked": 257588, "writesMatched": 257588, "attributeWritesChecked": 77393, "attributeWritesMatched": 77393}}};
function nums(){if(!S){document.getElementById('nums').innerHTML='<tr><td>Этот уровень ещё не проверен по кадрам</td><td></td></tr>';return}
const rows=[["кадров",S.frames],["сравнений",S.samples],["совпало",S.matched],["совпадение, %",S.matchPercent],["устаревших",S.staleSamples],["без устаревших, %",S.matchPercentStaleApart],["записей тайлов сверено",S.writesChecked+" / совпало "+S.writesMatched],["записей атрибутов",S.attributeWritesChecked+" / совпало "+S.attributeWritesMatched],["клеток не пустоты",S.cellsNotVoid],["из них увидено",S.cellsNotVoidSeen],["клеток с расхождением",S.cellsEverDiffered]];
for(const p of Object.entries(S.parts||{}))rows.push(["часть «"+p[0]+"»: кадров / %",p[1].frames+" / "+p[1].matchPercent+" (без устаревших "+p[1].matchPercentStaleApart+")"]);
document.getElementById('nums').innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td>${typeof r[1]==='number'?r[1].toLocaleString('ru'):r[1]}</td></tr>`).join('')}
nums();
const L=iLevel,C=iCheck,st=stage;let z=1;
function mode(m){[bLevel,bCheck,bBlend].forEach(b=>b.classList.remove('on'));
 if(m==='l'){L.style.display='';C.style.display='none';bLevel.classList.add('on')}
 if(m==='c'){L.style.display='none';C.style.display='';C.style.opacity=1;bCheck.classList.add('on')}
 if(m==='b'){L.style.display='';C.style.display='';C.style.opacity=.5;bBlend.classList.add('on')}}
bLevel.onclick=()=>mode('l');bCheck.onclick=()=>mode('c');bBlend.onclick=()=>mode('b');
function size(){st.style.width=L.naturalWidth*z+'px';st.style.height=L.naturalHeight*z+'px';[L,C].forEach(i=>i.style.width=i.naturalWidth*z+'px')}
L.onload=size;
lvl.onchange=()=>{const n=+lvl.value,nn=String(n).padStart(2,'0');S=CHECKS[n];L.src=nn+'.png';bCheck.disabled=bBlend.disabled=!S;if(S)C.src=nn+'-check.png';else mode('l');nums();document.title='Alien 3 — уровень '+n};document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{z=+b.dataset.z;document.querySelectorAll('[data-z]').forEach(x=>x.classList.toggle('on',x===b));size()});
st.onmousemove=e=>{const r=st.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/z),y=Math.floor((e.clientY-r.top)/z);
 const page=Math.floor(y/240),ty=Math.floor(y/8),inPage=Math.floor((ty%30)/4);
 pos.textContent=`x ${x} y ${y} · тайл ${x>>3},${ty} · блок ${x>>5}, ряд раскладки ${page*8+inPage} (стр. ${page})`};
</script></body></html>
